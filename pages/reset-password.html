<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1">

<title>Reset Password - RuckuZ</title>

<link
    rel="stylesheet"
    href="../css/main.css">

<link
    rel="stylesheet"
    href="../css/auth.css">

<link
    rel="icon"
    type="image/x-icon"
    href="../assets/favicon.ico">
</head>

<body>
<div id="app">
    <div class="authCard">
        <h1>
            Reset Password
        </h1>

        <p class="subtitle">
            Choose a new password for your RuckuZ account.
        </p>

        <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            placeholder="New password">

        <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Confirm new password">

        <button
            id="authButton"
            type="button"
            disabled>
            Change Password
        </button>

        <p id="status">
            Checking reset link...
        </p>
    </div>
</div>
<script
    type="module"
    src="../js/resetPassword.js">
</script>
</body>
</html>
