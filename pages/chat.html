<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>RuckuZ</title>

<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/profilePopup.css">
<link rel="icon" type="image/png" href="/assets/favicon.ico">

<style>

body {
    margin: 0;
    min-height: 100vh;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    margin-bottom:18px;
}

.messageMenu{
    width:24px;
    opacity:0;
    cursor:pointer;
    user-select:none;
    transition:.15s;
    font-size:22px;
    color:#666;

}

.message:hover .messageMenu{
    opacity:1;

}

.messageDropdown{
    position:absolute;
    background:white;
    border:3px solid #6b58b8;
    border-radius:12px;
    padding:6px;
    display:none;
    flex-direction:column;
    min-width:160px;
    z-index:500;
    box-shadow:6px 6px 0 #6b58b8;

}

.messageDropdown button{
    background:none;
    border:none;
    padding:10px;
    text-align:left;
    cursor:pointer;
    font-size:15px;

}

.messageDropdown button:hover{
    background:#efe8ff;

}

.messageRow{
    display:flex;
    gap:12px;
    align-items:flex-start;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #6b58b8;
    flex-shrink:0;
}

.messageContent{
    flex:1;
}

.username{
    font-weight:bold;
    color:#6b58b8;
    margin-bottom:3px;
}

.text{
    line-height:1.5;
    word-break:break-word;
}

#bottom{
    display:flex;
    padding:15px;
    gap:10px;
    border-top:3px solid #6b58b8;
}

input{
    flex:1;
    padding:15px;
    font-size:18px;
}

button{
    padding:15px 30px;
}

body:not(.darkMode) {
    background-image: url("../bg/paper.png");
    background-repeat: repeat;
    background-size: auto;
}

body.darkMode {
    background-image: url("../bg/darknote.png");
    background-repeat: repeat;
    background-size: auto;
}

body.darkMode #chat {
    background: #302b48;
    border-color: #8b6cff;
    color: #f5f0ff;
}

body.darkMode #messages {
    background: #302b48;
}

body.darkMode .username {
    color: #b79cff;
}

body.darkMode .text {
    color: #f5f0ff;
}

body.darkMode #bottom {
    background: #26223a;
    border-top-color: #8b6cff;
}

body.darkMode #messageInput {
    background: #1f1c30;
    color: #ffffff;
    border: 2px solid #8b6cff;
}

body.darkMode #messageInput::placeholder {
    color: #aaa2bd;
}

#topBar {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 10000;

    display: flex;
    align-items: center;
    gap: 14px;
}
    
.themeToggle {
    position: static;
    padding: 10px 16px;
    border: 3px solid #6b58b8;
    border-radius: 14px;
    background: #ffd36b;
    color: #30254f;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 4px 4px 0 #6b58b8;
    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.themeToggle:hover {
    transform: translate(-2px, -2px);
    box-shadow:
        6px 6px 0 #6b58b8;
}

.themeToggle:active {
    transform: translate(2px, 2px);
    box-shadow:
        2px 2px 0 #6b58b8;
}

body.darkMode .themeToggle {
    background: #8b6cff;
    color: white;
    border-color: #b79cff;
    box-shadow: 4px 4px 0 #b79cff;
}

body.darkMode .themeToggle:hover {
    box-shadow: 6px 6px 0 #b79cff;
}

.logoutButton {
    position: static;

    padding: 10px 16px;

    border: 3px solid #b84f4f;
    border-radius: 14px;

    background: #ff8585;
    color: #4a2020;

    font-weight: bold;
    font-size: 15px;

    cursor: pointer;

    box-shadow: 4px 4px 0 #b84f4f;

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.logoutButton:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 #b84f4f;
}

.logoutButton:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 #b84f4f;
}

body.darkMode .logoutButton {
    background: #d96666;
    color: #fff4f4;
    border-color: #a94444;
    box-shadow: 4px 4px 0 #a94444;
}

body.darkMode .logoutButton:hover {
    box-shadow: 6px 6px 0 #a94444;
}

.friendRequestsButton {
    position: static;
    padding: 10px 16px;
    border: 3px solid #6b58b8;
    border-radius: 14px;
    background: #ffd36b;
    color: #30254f;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 4px 4px 0 #6b58b8;
    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.friendRequestsButton:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 #6b58b8;
}

#friendRequestCount {
    display: inline-flex;
    min-width: 20px;
    height: 20px;
    margin-left: 5px;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #ff6868;
    color: white;
    font-size: 12px;
}

.friendRequestsPanel {
    position: fixed;
    top: 75px;
    right: 20px;
    width: 340px;
    max-height: 500px;
    z-index: 9999;
    display: none;
    flex-direction: column;
    background: #fff8df;
    border: 4px solid #6b58b8;
    border-radius: 18px;
    box-shadow: 8px 8px 0 #6b58b8;
    overflow: hidden;
}

.friendRequestsHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 3px dashed #6b58b8;
}

.friendRequestsHeader h2 {
    margin: 0;
    font-size: 20px;
}

#closeFriendRequests {
    border: 0;
    background: transparent;
    font-size: 20px;
    cursor: pointer;
}

#friendRequestsList {
    padding: 12px;
    overflow-y: auto;
}

.friendRequest {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    margin-bottom: 10px;
    border: 2px solid #c7b8ed;
    border-radius: 12px;
    background: white;
}

.friendRequestAvatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #6b58b8;
}

.friendRequestInfo {
    flex: 1;
    min-width: 0;
}

.friendRequestName {
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.friendRequestButtons {
    display: flex;
    gap: 5px;
    margin-top: 6px;
}

.friendRequestButtons button {
    padding: 5px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.acceptRequest {
    border: 2px solid #4e9c65;
    background: #8ee6a5;
}

.declineRequest {
    border: 2px solid #c65353;
    background: #ff9292;
}

.noRequests {
    text-align: center;
    padding: 20px;
    margin: 0;
    opacity: 0.7;
}

body.darkMode .friendRequestsPanel {
    background: #302b48;
    color: #f5f0ff;
    border-color: #8b6cff;
    box-shadow: 8px 8px 0 #8b6cff;
}

body.darkMode .friendRequestsHeader {
    border-color: #8b6cff;
}

body.darkMode .friendRequest {
    background: #242038;

    border-color: #7563a8;
}

#friendsButton {
    position: static;
    padding: 10px 18px;
    border: 2px solid #6b58b8;
    border-radius: 10px;
    background: white;
    color: #6b58b8;
    font-weight: bold;
    cursor: pointer;
}

#friendsCount {
    margin-left: 5px;
    font-size: 13px;
}

#friendsPanel {
    display: none;
    position: fixed;
    top: 70px;
    right: 20px;
    width: 320px;
    max-height: 500px;
    background: white;
    border: 3px solid #6b58b8;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    z-index: 2000;
    flex-direction: column;
    overflow: hidden;
}

#friendsHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    border-bottom: 2px solid #6b58b8;
}

#friendsHeader h2 {
    margin: 0;
    color: #6b58b8;
}

#closeFriends {
    border: none;
    background: transparent;
    font-size: 20px;
    cursor: pointer;
}

#friendsList {
    padding: 10px;
    overflow-y: auto;
}

.friendItem {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
}

.friendItem:hover {
    background: #f0ebff;
}

.friendItemAvatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #6b58b8;
}

.friendItemName {
    font-weight: bold;
    color: #6b58b8;
}

.noFriends {
    text-align: center;
    padding: 20px;
}

#fileButton {
    width: 52px;
    height: 52px;
    padding: 0;
    border: 3px solid #6b58b8;
    border-radius: 14px;
    background: #ffd36b;
    color: #30254f;
    font-size: 30px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 4px 4px 0 #6b58b8;
    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

#fileButton:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 #6b58b8;
}

#fileButton:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 #6b58b8;
}

body.darkMode #fileButton {
    background: #8b6cff;
    color: white;
    border-color: #b79cff;
    box-shadow: 4px 4px 0 #b79cff;
}

.messageFile {
    margin-top: 10px;
    max-width: 500px;
}

.messageFile img,
.messageFile video {
    display: block;
    max-width: 100%;
    max-height: 450px;
    border-radius: 12px;
    border: 3px solid #6b58b8;
}

.messageFile video {
    background: black;
}

.fileAttachment {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border: 3px solid #6b58b8;
    border-radius: 12px;
    background: #fff8df;
    color: #30254f;
    font-weight: bold;
    text-decoration: none;
}

.uploadingFile {
    position: relative;
    display: inline-block;
    max-width: 500px;
    margin-top: 10px;
    border-radius: 12px;
    overflow: hidden;
}

.uploadingFile img,
.uploadingFile video {
    display: block;
    max-width: 100%;
    max-height: 450px;
    border-radius: 12px;
    filter: brightness(35%);
}

.uploadingOverlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.25);
}

.uploadSpinner {
    width: 42px;
    height: 42px;
    border: 5px solid rgba(255,255,255,0.35);
    border-top-color: white;
    border-radius: 50%;
    animation: uploadSpin 0.8s linear infinite;
}

@keyframes uploadSpin {
    to {
        transform: rotate(360deg);
    }
}

body.darkMode .fileAttachment {
    background: #242038;
    color: #f5f0ff;
    border-color: #8b6cff;
}

.localMessage {
    opacity: 0.75;
}

.localMessageStatus {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 6px;
    font-size: 12px;
    color: #81769d;
}

.messageSpinner {
    width: 12px;
    height: 12px;

    border: 2px solid #c9c1d9;
    border-top-color: #6b58b8;

    border-radius: 50%;

    animation: messageSpin 0.7s linear infinite;
}

@keyframes messageSpin {
    to {
        transform: rotate(360deg);
    }
}

.messageFailed {
    color: #d34f4f;
    font-weight: bold;
}

.messageFailed::before {
    content: "⚠ ";
}

.messageFile audio {
    width: 450px;
    max-width: 100%;
}

.audioFileName {
    margin-top: 6px;
    font-size: 13px;
    font-weight: bold;
    color: #6b58b8;
}

body.darkMode .audioFileName {
    color: #b79cff;
}

.messageGif {
    margin-top: 8px;
    max-width: 420px;
    border-radius: 12px;
    overflow: hidden;
}

.messageGif img {
    display: block;
    width: auto;
    max-width: 100%;
    max-height: 420px;
    border-radius: 12px;
    object-fit: contain;
}

body.darkMode .messageGif img {
    border: 2px solid #7563a8;
}

#mobileMenuButton,
#mobileMenu {
    display: none;
}

@media (max-width: 768px) {

    body {
        align-items: flex-start;
        justify-content: flex-start;
        height: 100dvh;
        overflow: hidden;
    }

    #topBar {
        position: fixed;
        top: 8px;
        left: 8px;
        right: 8px;
        z-index: 10000;
        display: flex;
        justify-content: flex-start;
        align-items: center;
    }

    #desktopTopButtons {
        display: none;
    }
    #mobileMenuButton {
        display: flex;
        width: 50px;
        height: 50px;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 3px solid #6b58b8;
        border-radius: 14px;
        background: #ffd36b;
        color: #30254f;
        font-size: 27px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 4px 4px 0 #6b58b8;
    }

    #mobileMenuButton:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #6b58b8;
    }
    body.darkMode #mobileMenuButton {
        background: #8b6cff;
        color: white;
        border-color: #b79cff;
        box-shadow: 4px 4px 0 #b79cff;
    }
    #mobileMenu {
        position: fixed;
        top: 68px;
        left: 10px;
        width: 220px;
        z-index: 11000;
        padding: 10px;
        flex-direction: column;
        gap: 8px;
        background: white;
        border: 3px solid #6b58b8;
        border-radius: 16px;
        box-shadow: 6px 6px 0 #6b58b8;
    }
    #mobileMenu.open {
        display: flex;
    }
    #mobileMenu button {
        width: 100%;
        padding: 13px;
        border: 2px solid #6b58b8;
        border-radius: 11px;
        background: #fff8df;
        color: #30254f;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    #mobileMenu button:active {
        transform: translate(1px, 1px);
    }
    #mobileRequestCount,
    #mobileFriendsCount {
        display: inline-flex;
        min-width: 20px;
        height: 20px;
        margin-left: 5px;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #ff6868;
        color: white;
        font-size: 12px;
    }
    body.darkMode #mobileMenu {
        background: #302b48;
        border-color: #8b6cff;
        box-shadow: 6px 6px 0 #8b6cff;
    }
    body.darkMode #mobileMenu button {
        background: #242038;
        color: #f5f0ff;
        border-color: #8b6cff;
    }
    #chat {
    width: 100vw;
    height: calc(100dvh - 68px);
    margin-top: 68px;
    border: none;
    border-radius: 0;
    box-sizing: border-box;
    }
    #messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    }
    .avatar {
        width: 42px;
        height: 42px;
    }
    .username {
        font-size: 17px;
    }

    .text {
        font-size: 16px;
    }
    .messageRow {
        gap: 9px;
    }
    .messageFile img,
    .messageFile video {
        max-width: 100%;
        height: auto;
        border-radius: 14px;
    }
    .messageFile audio {
        max-width: 100%;
    }
    #bottom {
    flex-shrink: 0;
    box-sizing: border-box;
    width: 100%;
    }
    #messageInput {
    min-width: 0;
    width: 100%;
    box-sizing: border-box;
    }
    #send {
    flex-shrink: 0;
    }
    #fileButton {
    flex-shrink: 0;
    }
    #friendsPanel,
    .friendRequestsPanel {
        top: 70px;
        left: 10px;
        right: 10px;
        width: auto;
        max-height: 70dvh;
    }
    .messageDropdown {
        min-width: 180px;
    }
    .messageDropdown button {
        padding: 14px;
        font-size: 16px;
    }
    .messageMenu {
        display: none;
    }
}
@media (max-width: 768px) {
    .mobileMessageDropdown {
        position: fixed !important;
        min-width: 190px;
        border: 3px solid #6b58b8;
        border-radius: 14px;
        background: white;
        box-shadow:
            6px 6px 0 #6b58b8;
        z-index: 20000;
    }
    .mobileMessageDropdown button {
        padding: 15px 16px;
        font-size: 17px;
        border-radius: 10px;
    }
    .mobileMessageDropdown .deleteBtn {
        color: #c65353;
    }
    body.darkMode .mobileMessageDropdown {
        background: #302b48;
        border-color: #8b6cff;
        box-shadow:
            6px 6px 0 #8b6cff;
    }
}

.customMediaPlayer {
    position: relative;
    width: min(100%, 650px);
    margin-top: 10px;
    overflow: hidden;
    border: 3px solid #6b58b8;
    border-radius: 16px;
    background: #201c35;
    box-shadow: 5px 5px 0 #6b58b8;
}

.customVideoPlayer {
    background: #151222;
}

.customVideoPlayer .mediaElement {
    display: block;
    width: 100%;
    max-height: 500px;
    object-fit: contain;
    background: #151222;
}

.mediaControls,
.audioControls {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 12px;
    background: #302b48;
    border-top: 2px solid #6b58b8;
}

.mediaPlayButton,
.mediaMuteButton,
.mediaFullscreenButton {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #8b6cff;
    border-radius: 10px;
    background: #6b58b8;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition:
        transform 0.12s ease,
        background 0.12s ease;
}

.mediaPlayButton:hover,
.mediaMuteButton:hover,
.mediaFullscreenButton:hover {
    transform: translateY(-1px);
    background: #795fe0;
}

.mediaPlayButton:active,
.mediaMuteButton:active,
.mediaFullscreenButton:active {
    transform: translateY(1px);
}

.mediaTime {
    min-width: 72px;
    color: #f5f0ff;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
}
.mediaProgress {
    --progress: 0%;
    flex: 1 1 auto;
    min-width: 60px;
    width: auto;
    height: 8px;
    padding: 0;
    margin: 0;
    appearance: none;
    -webkit-appearance: none;
    border: none;
    border-radius: 999px;
    background:
        linear-gradient(
            to right,
            #8b6cff 0%,
            #8b6cff var(--progress),
            #5b5278 var(--progress),
            #5b5278 100%
        );
    cursor: pointer;
    outline: none;
}

.mediaProgress::-webkit-slider-runnable-track {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: transparent;
}

.mediaProgress::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 17px;
    height: 17px;
    margin-top: -4.5px;
    border: 2px solid #6b58b8;
    border-radius: 50%;
    background: #ffd36b;
    cursor: pointer;
}

.mediaProgress::-moz-range-track {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: #5b5278;
}

.mediaProgress::-moz-range-progress {
    height: 8px;
    border-radius: 999px;
    background: #8b6cff;
}

.mediaProgress::-moz-range-thumb {
    width: 17px;
    height: 17px;
    border: 2px solid #6b58b8;
    border-radius: 50%;
    background: #ffd36b;
    cursor: pointer;
}

.mediaProgress::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #6b58b8;
    background: #ffd36b;
    cursor: pointer;
}
.mediaVolume {
    --volume: 100%;
    flex: 0 0 80px;
    width: 80px;
    height: 7px;
    padding: 0;
    margin: 0;
    appearance: none;
    -webkit-appearance: none;
    border: none;
    border-radius: 999px;
    background:
        linear-gradient(
            to right,
            #8b6cff 0%,
            #8b6cff var(--volume),
            #5b5278 var(--volume),
            #5b5278 100%
        );
    cursor: pointer;
    outline: none;
}
.mediaVolume::-webkit-slider-runnable-track {
    width: 100%;
    height: 7px;
    border-radius: 999px;
    background: transparent;
}
.mediaVolume::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 15px;
    height: 15px;
    margin-top: -4px;
    border: 2px solid #6b58b8;
    border-radius: 50%;
    background: #ffd36b;
    cursor: pointer;
}
.mediaVolume::-moz-range-track {
    width: 100%;
    height: 7px;
    border-radius: 999px;
    background: #5b5278;
}
.mediaVolume::-moz-range-progress {
    height: 7px;
    border-radius: 999px;
    background: #8b6cff;
}

.mediaVolume::-moz-range-thumb {
    width: 15px;
    height: 15px;
    border: 2px solid #6b58b8;
    border-radius: 50%;
    background: #ffd36b;
    cursor: pointer;
}

.customAudioPlayer {
    display: flex;
    align-items: center;
    padding: 12px;
    min-height: 75px;
    box-sizing: border-box;
}

.audioPlayerIcon {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
    border: 2px solid #8b6cff;
    border-radius: 12px;
    background: #6b58b8;
    color: white;
    font-size: 25px;
    font-weight: bold;
}


.audioPlayerMain {
    flex: 1;
    min-width: 0;
}

.customAudioPlayer .audioFileName {
    margin-bottom: 7px;
    color: #f5f0ff;
    font-size: 14px;
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.customAudioPlayer .audioControls {
    padding: 0;
    border: 0;
    background: transparent;
}

.customAudioPlayer .mediaElement {
    display: none;
}

body:not(.darkMode) .customMediaPlayer {
    background: #fff8df;
    border-color: #6b58b8;
    box-shadow: 5px 5px 0 #6b58b8;
}

body:not(.darkMode) .mediaControls,
body:not(.darkMode) .audioControls {
    background: #fff8df;
    border-top-color: #6b58b8;
}

body:not(.darkMode) .mediaTime {
    color: #30254f;
}

body:not(.darkMode) .customAudioPlayer .audioFileName {
    color: #30254f;
}

body:not(.darkMode) .mediaProgress {
    background:
        linear-gradient(
            to right,
            #6b58b8 0%,
            #6b58b8 var(--progress),
            #c7b8ed var(--progress),
            #c7b8ed 100%
        );
}

body:not(.darkMode) .mediaVolume {
    background:
        linear-gradient(
            to right,
            #6b58b8 0%,
            #6b58b8 var(--volume),
            #c7b8ed var(--volume),
            #c7b8ed 100%
        );
}

body.darkMode .customMediaPlayer {
    background: #201c35;
    border-color: #8b6cff;
    box-shadow: 5px 5px 0 #8b6cff;
}

body.darkMode .mediaControls,
body.darkMode .audioControls {
    background: #26223a;
    border-top-color: #8b6cff;
}

body.darkMode .mediaPlayButton,
body.darkMode .mediaMuteButton,
body.darkMode .mediaFullscreenButton {
    border-color: #b79cff;
    background: #6b58b8;
}

body.darkMode .mediaProgress {
    background:
        linear-gradient(
            to right,
            #8b6cff 0%,
            #8b6cff var(--progress),
            #514875 var(--progress),
            #514875 100%
        );
}

body.darkMode .mediaVolume {
    background:
        linear-gradient(
            to right,
            #8b6cff 0%,
            #8b6cff var(--volume),
            #514875 var(--volume),
            #514875 100%
        );
}

@media (max-width: 700px) {
    .customMediaPlayer {
        width: 100%;
        max-width: 100%;
        border-radius: 12px;
        box-shadow: 3px 3px 0 #6b58b8;
    }
    .customVideoPlayer .mediaElement {
        max-height: 350px;
    }
    .mediaControls,
    .audioControls {
        gap: 6px;
        padding: 8px;
    }
    .mediaPlayButton,
    .mediaMuteButton,
    .mediaFullscreenButton {
        width: 36px;
        height: 36px;
        border-radius: 9px;
    }
    .mediaTime {
        min-width: 65px;
        font-size: 11px;
    }
    .mediaVolume {
        width: 55px;
    }
    .customAudioPlayer {
        padding: 9px;
    }
    .audioPlayerIcon {
        width: 42px;
        height: 42px;
        margin-right: 9px;
        font-size: 22px;
    }
    .customAudioPlayer .audioFileName {
        font-size: 13px;
    }

}

.customMediaPlayer:fullscreen {
    width: 100vw;
    height: 100vh;
    max-width: none;
    max-height: none;
    margin: 0;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.customMediaPlayer:-webkit-full-screen {
    width: 100vw;
    height: 100vh;
    max-width: none;
    max-height: none;
    margin: 0;
    border: none;
    border-radius: 0;
    box-shadow: none;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.customMediaPlayer:fullscreen .mediaElement {
    width: 100%;
    height: 100%;
    max-height: none;
    object-fit: contain;
    background: #000;
    flex: 1;
}

.customMediaPlayer:-webkit-full-screen .mediaElement {
    width: 100%;
    height: 100%;
    max-height: none;
    object-fit: contain;
    background: #000;
    flex: 1;
}

.customMediaPlayer:fullscreen .mediaControls {
    flex-shrink: 0;
    width: 100%;
    box-sizing: border-box;
    padding: 14px 18px;
    border-top: 2px solid #6b58b8;
}

.customMediaPlayer:-webkit-full-screen .mediaControls {
    flex-shrink: 0;
    width: 100%;
    box-sizing: border-box;
    padding: 14px 18px;
    border-top: 2px solid #6b58b8;
}

@media (max-width: 700px) {
    .mediaVolume {
        width: 55px;
    }
    .customMediaPlayer:fullscreen .mediaControls,
    .customMediaPlayer:-webkit-full-screen .mediaControls {
        padding:
            10px
            max(10px, env(safe-area-inset-right))
            calc(10px + env(safe-area-inset-bottom))
            max(10px, env(safe-area-inset-left));
    }
}

#serverLayout {
    position: fixed;
    top: 105px;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    width: min(1400px, calc(100vw - 80px));
    display: grid;
    grid-template-columns:
        255px
        minmax(500px, 1fr)
        255px;
    gap: 30px;
    min-height: 0;
}

#serverSidebar {
    min-height: 0;
    background: #302b48;
    border: 3px solid #8b6cff;
    overflow: hidden;
}

#serverBanner {
    height: 110px;
    background: #242038;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.serverBannerPlaceholder {
    color: #b79cff;
    font-size: 18px;
    text-align: center;
}

#serverName {
    padding: 14px;
    border-bottom: 3px solid #8b6cff;
    text-align: center;
}

.serverSubtitle {
    color: #b79cff;
    font-size: 18px;
}

.serverTitle {
    margin-top: 8px;
    color: #b79cff;
    font-size: 25px;
}

#channelList {
    display: flex;
    flex-direction: column;
}

.channelButton {
    width: 100%;
    padding: 9px 18px;
    border: 0;
    border-bottom: 2px solid #8b6cff;
    background: transparent;
    color: #b79cff;
    text-align: left;
    font-size: 21px;
    cursor: pointer;
    box-sizing: border-box;
}

.channelButton:hover {
    background: #3d365d;
}

.channelButton.active {
    background: #403863;
    color: white;
    font-weight: bold;
}

#chat {
    width: auto;
    height: auto;
    min-width: 0;
    min-height: 0;
    margin: 0;
    background: #302b48;
    border: 3px solid #8b6cff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

#chatHeader {
    flex-shrink: 0;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 15px;
    border-bottom: 3px solid #8b6cff;
    background: #302b48;
    color: #b79cff;
    font-size: 20px;
    font-weight: bold;
}

#currentChannelIcon {
    color: #8b6cff;
    font-size: 24px;
}

#messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
}

#memberSidebar {
    min-height: 0;
    background: #302b48;
    border: 3px solid #8b6cff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

#memberHeader {
    flex-shrink: 0;
    padding: 6px;
    border-bottom: 3px solid #8b6cff;
    color: #b79cff;
    text-align: center;
    font-size: 24px;
}

#memberList {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 8px;
}

.memberItem {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
}

.memberItem:hover {
    background: #3d365d;
}

.memberAvatarWrapper {
    position: relative;
    flex-shrink: 0;
}

.memberAvatar {
    width: 46px;
    height: 46px;

    border-radius: 50%;

    object-fit: cover;

    border: 2px solid #8b6cff;
}


.memberOnlineDot {
    position: absolute;

    right: -1px;
    bottom: -1px;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    border: 2px solid #302b48;

    background: #777;
}


.memberOnlineDot.online {
    background: #55d66f;
}


.memberInfo {
    min-width: 0;
}


.memberName {
    color: #b79cff;
    font-weight: bold;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
    
.memberStatus {
    font-size: 11px;
    color: #777;
}
    
.memberStatus.online {
    color: #55d66f;
}
    
body.darkMode #serverSidebar,
body.darkMode #memberSidebar,
body.darkMode #chat,
body.darkMode #chatHeader {
    background: #302b48;
}
    
@media (max-width: 768px) {
    #serverLayout {
        position: fixed;
        top: 68px;
        bottom: 0;
        left: 0;
        transform: none;
        width: 100%;
        display: block;
    }
    #serverSidebar,
    #memberSidebar,
    #chatHeader {
        display: none;
    }
    
    #chat {
        width: 100vw;
        height: calc(100dvh - 68px);
        margin-top: 0;
        border: none;
        border-radius: 0;
        box-sizing: border-box;
    }
    
    #messages {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
    }
    
    #bottom {
        flex-shrink: 0;
        width: 100%;
        box-sizing: border-box;
    }
}
    
</style>
</head>
<body>
<div id="topBar">
    <button id="mobileMenuButton" class="mobileMenuButton">
        ☰
    </button>
    <div id="desktopTopButtons">
        <button id="friendRequestsButton" class="friendRequestsButton">
            Requests
            <span id="friendRequestCount">0</span>
        </button>
        <button id="friendsButton">
            Friends
            <span id="friendsCount">0</span>
        </button>
        <button id="logoutButton" class="logoutButton">
            Logout
        </button>
        <button id="themeToggle" class="themeToggle">
            Dark Mode
        </button>
    </div>
</div>
    <div id="mobileMenu">
    <button id="mobileRequestsButton">
        Requests
        <span id="mobileRequestCount">0</span>
    </button>
    <button id="mobileFriendsButton">
        Friends
        <span id="mobileFriendsCount">0</span>
    </button>
    <button id="mobileLogoutButton">
        Logout
    </button>
    <button id="mobileThemeButton">
        Dark Mode
    </button>
    </div>
<div id="friendRequestsPanel" class="friendRequestsPanel">
    <div class="friendRequestsHeader">
        <h2>Friend Requests</h2>
        <button id="closeFriendRequests">
            ✕
        </button>
    </div>
    <div id="friendRequestsList">
        <p class="noRequests">
            No friend requests yet!
        </p>
    </div>
</div>
<div id="friendsPanel">
    <div id="friendsHeader">
        <h2>Friends</h2>
        <button id="closeFriends">
            ✕
        </button>
    </div>
    <div id="friendsList">
        <p class="noFriends">
            You don't have any friends yet!
        </p>
    </div>
</div>
<div id="serverLayout">
    <aside id="serverSidebar">
        <div id="serverBanner">
            <div class="serverBannerPlaceholder">
                (Server banner)
            </div>
        </div>
        <div id="serverName">
            <div class="serverSubtitle">
                RuckuZ
            </div>
            <div class="serverTitle">
                Test Lobby
            </div>
        </div>
        <div id="channelList">
            <button
                class="channelButton active"
                data-channel="general"
            >
                # general-chat
            </button>
            <button
                class="channelButton"
                data-channel="meme"
            >
                # meme-chat
            </button>
            <button
                class="channelButton"
                data-channel="media"
            >
                # media-chat
            </button>
            <button
                class="channelButton"
                data-channel="gaming"
            >
                # gaming-chat
            </button>
        </div>
    </aside>
    <main id="chat">
        <div id="chatHeader">

            <span id="currentChannelName">

            </span>
        </div>
        <div id="messages">
        </div>
        <div id="bottom">
            <button
                id="fileButton"
                type="button"
            >
                +
            </button>
            <input
                id="messageInput"
                placeholder="Say something..."
            >
            <button id="send">
                Send
            </button>
            <input
                type="file"
                id="fileUpload"
                style="display:none;"
            >
            <input
                type="file"
                id="avatarUpload"
                accept="image/png,image/jpeg,image/webp"
                style="display:none;"
            >
        </div>
    </main>
    <aside id="memberSidebar">
        <div id="memberHeader">
            Member List
        </div>
        <div id="memberList">
        </div>
    </aside>
</div>
