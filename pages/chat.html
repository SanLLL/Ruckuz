<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>RuckuZ Test lobby</title>

<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/profilePopup.css">
<link rel="icon" type="image/png" href="/assets/favicon.ico">

<style>

body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#chat{
    width:900px;
    height:700px;
    background:white;
    display:flex;
    flex-direction:column;
    border:4px solid #6b58b8;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    margin-bottom:18px;
}

.messageMenu{
    width:24px;
    opacity:0;
    cursor:pointer;
    user-select:none;
    transition:.15s;
    font-size:22px;
    color:#666;

}

.message:hover .messageMenu{
    opacity:1;

}

.messageDropdown{
    position:absolute;
    background:white;
    border:3px solid #6b58b8;
    border-radius:12px;
    padding:6px;
    display:none;
    flex-direction:column;
    min-width:160px;
    z-index:500;
    box-shadow:6px 6px 0 #6b58b8;

}

.messageDropdown button{
    background:none;
    border:none;
    padding:10px;
    text-align:left;
    cursor:pointer;
    font-size:15px;

}

.messageDropdown button:hover{
    background:#efe8ff;

}

.messageRow{
    display:flex;
    gap:12px;
    align-items:flex-start;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #6b58b8;
    flex-shrink:0;
}

.messageContent{
    flex:1;
}

.username{
    font-weight:bold;
    color:#6b58b8;
    margin-bottom:3px;
}

.text{
    line-height:1.5;
    word-break:break-word;
}

#bottom{
    display:flex;
    padding:15px;
    gap:10px;
    border-top:3px solid #6b58b8;
}

input{
    flex:1;
    padding:15px;
    font-size:18px;
}

button{
    padding:15px 30px;
}

body:not(.darkMode) {
    background-image: url("../bg/paper.png");
    background-repeat: repeat;
    background-size: auto;
}

body.darkMode {
    background-image: url("../bg/darknote.png");
    background-repeat: repeat;
    background-size: auto;
}

body.darkMode #chat {
    background: #302b48;
    border-color: #8b6cff;
    color: #f5f0ff;
}

body.darkMode #messages {
    background: #302b48;
}

body.darkMode .username {
    color: #b79cff;
}

body.darkMode .text {
    color: #f5f0ff;
}

body.darkMode #bottom {
    background: #26223a;
    border-top-color: #8b6cff;
}

body.darkMode #messageInput {
    background: #1f1c30;
    color: #ffffff;
    border: 2px solid #8b6cff;
}

body.darkMode #messageInput::placeholder {
    color: #aaa2bd;
}

#topBar {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 10000;

    display: flex;
    align-items: center;
    gap: 14px;
}
    
.themeToggle {
    position: static;
    padding: 10px 16px;
    border: 3px solid #6b58b8;
    border-radius: 14px;
    background: #ffd36b;
    color: #30254f;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 4px 4px 0 #6b58b8;
    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.themeToggle:hover {
    transform: translate(-2px, -2px);
    box-shadow:
        6px 6px 0 #6b58b8;
}

.themeToggle:active {
    transform: translate(2px, 2px);
    box-shadow:
        2px 2px 0 #6b58b8;
}

body.darkMode .themeToggle {
    background: #8b6cff;
    color: white;
    border-color: #b79cff;
    box-shadow: 4px 4px 0 #b79cff;
}

body.darkMode .themeToggle:hover {
    box-shadow: 6px 6px 0 #b79cff;
}

.logoutButton {
    position: static;

    padding: 10px 16px;

    border: 3px solid #b84f4f;
    border-radius: 14px;

    background: #ff8585;
    color: #4a2020;

    font-weight: bold;
    font-size: 15px;

    cursor: pointer;

    box-shadow: 4px 4px 0 #b84f4f;

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.logoutButton:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 #b84f4f;
}

.logoutButton:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 #b84f4f;
}

body.darkMode .logoutButton {
    background: #d96666;
    color: #fff4f4;
    border-color: #a94444;
    box-shadow: 4px 4px 0 #a94444;
}

body.darkMode .logoutButton:hover {
    box-shadow: 6px 6px 0 #a94444;
}

.friendRequestsButton {
    position: static;
    padding: 10px 16px;
    border: 3px solid #6b58b8;
    border-radius: 14px;
    background: #ffd36b;
    color: #30254f;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 4px 4px 0 #6b58b8;
    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.friendRequestsButton:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 #6b58b8;
}

#friendRequestCount {
    display: inline-flex;
    min-width: 20px;
    height: 20px;
    margin-left: 5px;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #ff6868;
    color: white;
    font-size: 12px;
}

.friendRequestsPanel {
    position: fixed;
    top: 75px;
    right: 20px;
    width: 340px;
    max-height: 500px;
    z-index: 9999;
    display: none;
    flex-direction: column;
    background: #fff8df;
    border: 4px solid #6b58b8;
    border-radius: 18px;
    box-shadow: 8px 8px 0 #6b58b8;
    overflow: hidden;
}

.friendRequestsHeader {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 3px dashed #6b58b8;
}

.friendRequestsHeader h2 {
    margin: 0;
    font-size: 20px;
}

#closeFriendRequests {
    border: 0;
    background: transparent;
    font-size: 20px;
    cursor: pointer;
}

#friendRequestsList {
    padding: 12px;
    overflow-y: auto;
}

.friendRequest {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    margin-bottom: 10px;
    border: 2px solid #c7b8ed;
    border-radius: 12px;
    background: white;
}

.friendRequestAvatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #6b58b8;
}

.friendRequestInfo {
    flex: 1;
    min-width: 0;
}

.friendRequestName {
    font-weight: bold;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.friendRequestButtons {
    display: flex;
    gap: 5px;
    margin-top: 6px;
}

.friendRequestButtons button {
    padding: 5px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.acceptRequest {
    border: 2px solid #4e9c65;
    background: #8ee6a5;
}

.declineRequest {
    border: 2px solid #c65353;
    background: #ff9292;
}

.noRequests {
    text-align: center;
    padding: 20px;
    margin: 0;
    opacity: 0.7;
}

body.darkMode .friendRequestsPanel {
    background: #302b48;
    color: #f5f0ff;
    border-color: #8b6cff;
    box-shadow: 8px 8px 0 #8b6cff;
}

body.darkMode .friendRequestsHeader {
    border-color: #8b6cff;
}

body.darkMode .friendRequest {
    background: #242038;

    border-color: #7563a8;
}

#friendsButton {
    position: static;
    padding: 10px 18px;
    border: 2px solid #6b58b8;
    border-radius: 10px;
    background: white;
    color: #6b58b8;
    font-weight: bold;
    cursor: pointer;
}

#friendsCount {
    margin-left: 5px;
    font-size: 13px;
}

#friendsPanel {
    display: none;
    position: fixed;
    top: 70px;
    right: 20px;
    width: 320px;
    max-height: 500px;
    background: white;
    border: 3px solid #6b58b8;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    z-index: 2000;
    flex-direction: column;
    overflow: hidden;
}

#friendsHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    border-bottom: 2px solid #6b58b8;
}

#friendsHeader h2 {
    margin: 0;
    color: #6b58b8;
}

#closeFriends {
    border: none;
    background: transparent;
    font-size: 20px;
    cursor: pointer;
}

#friendsList {
    padding: 10px;
    overflow-y: auto;
}

.friendItem {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
}

.friendItem:hover {
    background: #f0ebff;
}

.friendItemAvatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #6b58b8;
}

.friendItemName {
    font-weight: bold;
    color: #6b58b8;
}

.noFriends {
    text-align: center;
    padding: 20px;
}
    
</style>
</head>
<body>
<div id="topBar">
    <button id="friendRequestsButton" class="friendRequestsButton">
        Requests
        <span id="friendRequestCount">0</span>
    </button>
    <button id="friendsButton">
        Friends
        <span id="friendsCount">0</span>
    </button>
    <button id="logoutButton" class="logoutButton">
        Logout
    </button>
    <button id="themeToggle" class="themeToggle">
        Dark Mode
    </button>
</div>
<div id="friendRequestsPanel" class="friendRequestsPanel">
    <div class="friendRequestsHeader">
        <h2>Friend Requests</h2>
        <button id="closeFriendRequests">
            ✕
        </button>
    </div>
    <div id="friendRequestsList">
        <p class="noRequests">
            No friend requests yet!
        </p>
    </div>
</div>
<div id="friendsPanel">
    <div id="friendsHeader">
        <h2>Friends</h2>

        <button id="closeFriends">
            ✕
        </button>

    </div>
    <div id="friendsList">

        <p class="noFriends">
            You don't have any friends yet!
        </p>
    </div>
</div>
<div id="chat">
<div id="messages">
</div>
<div id="bottom">

<input
id="messageInput"
placeholder="Say something..."
>

<button id="send">

Send

</button>
    
<input
    type="file"
    id="avatarUpload"
    accept="image/png,image/jpeg,image/webp"
    style="display:none;"
>
</div>
</div>
<script type="module" src="../js/chat.js"></script>
</body>
</html>
