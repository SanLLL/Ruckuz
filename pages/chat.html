<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>RuckuZ Test lobby</title>

<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/profilePopup.css">

<style>

body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#chat{
    width:900px;
    height:700px;
    background:white;
    display:flex;
    flex-direction:column;
    border:4px solid #6b58b8;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    margin-bottom:18px;
}

.messageMenu{
    width:24px;
    opacity:0;
    cursor:pointer;
    user-select:none;
    transition:.15s;
    font-size:22px;
    color:#666;

}

.message:hover .messageMenu{
    opacity:1;

}

.messageDropdown{
    position:absolute;
    background:white;
    border:3px solid #6b58b8;
    border-radius:12px;
    padding:6px;
    display:none;
    flex-direction:column;
    min-width:160px;
    z-index:500;
    box-shadow:6px 6px 0 #6b58b8;

}

.messageDropdown button{
    background:none;
    border:none;
    padding:10px;
    text-align:left;
    cursor:pointer;
    font-size:15px;

}

.messageDropdown button:hover{
    background:#efe8ff;

}

.messageRow{
    display:flex;
    gap:12px;
    align-items:flex-start;
}

.avatar{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid #6b58b8;
    flex-shrink:0;
}

.messageContent{
    flex:1;
}

.username{
    font-weight:bold;
    color:#6b58b8;
    margin-bottom:3px;
}

.text{
    line-height:1.5;
    word-break:break-word;
}

#bottom{
    display:flex;
    padding:15px;
    gap:10px;
    border-top:3px solid #6b58b8;
}

input{
    flex:1;
    padding:15px;
    font-size:18px;
}

button{
    padding:15px 30px;
}

</style>
</head>
<body>
<div id="chat">
<div id="messages">
</div>
<div id="bottom">

<input
id="messageInput"
placeholder="Say something..."
>

<button id="send">

Send

</button>
    
<input
    type="file"
    id="avatarUpload"
    accept="image/png,image/jpeg,image/webp"
    style="display:none;"
>
</div>
</div>
<script type="module" src="../js/chat.js"></script>
</body>
</html>
