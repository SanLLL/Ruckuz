<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuckuZ</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#1e1f22;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:#2b2d31;
            padding:40px;
            border-radius:16px;
            text-align:center;
            width:420px;
            box-shadow:0 0 30px rgba(0,0,0,.35);
        }

        h1{
            font-size:42px;
            margin-bottom:10px;
        }

        p{
            color:#b5bac1;
            margin-bottom:25px;
        }

        button{
            border:none;
            background:#5865f2;
            color:white;
            padding:14px 24px;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#4752c4;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>RuckuZ</h1>
    <p>Chatting</p>

    <button onclick="alert('Soon')">
        Enter
    </button>
</div>

</body>
</html>
