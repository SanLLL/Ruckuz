<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RuckuZ</title>

<script>
(function () {
    function readCookie(name) {
        const prefix =
            encodeURIComponent(name) + "=";
        const cookies =
            document.cookie.split(";");
        for (const cookie of cookies) {
            const value =
                cookie.trim();
            if (value.startsWith(prefix)) {
                return decodeURIComponent(
                    value.slice(
                        prefix.length
                    )
                );
            }
        }
        return null;
    }
    const theme =
        readCookie("ruckuz-theme") ||
        localStorage.getItem("ruckuz-theme") ||
        "light";
    document.documentElement.classList.add(
        "authBooting"
    );
    document.documentElement.dataset.ruckuzTheme = theme;
    document.documentElement.style.backgroundColor =
        theme === "dark"
            ? "#151222"
            : "#fffdf6";
})();
</script>

<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="icon" type="image/png" href="assets/favicon.ico">

</head>

<body>

<div
    id="authLoadingScreen"
    role="status"
    aria-live="polite">
    <div id="authLoadingCard">
        <div id="authLoadingTitle">
            RuckuZ
        </div>
        <div id="authLoadingRow">
            <span id="authLoadingSpinner"></span>
            <span id="authLoadingText">
                Checking account...
            </span>
        </div>
    </div>
</div>

<div id="app">
<main id="authShell">
    <section id="authBrandPanel">
        <div id="authBrandTop">

            <img
                id="authLogo"
                src="logo/logo.png"
                alt="RuckuZ">

            <p id="authBrandTagline">
                Talk. Share. Cause a little RuckuZ.
            </p>

        </div>

        <div id="authMascotArea">

            <img
                id="authMascot"
                src="assets/avatars/ruckuz.png"
                alt="">

            <p>
                A place to doodle, chat,
                share media and hang out.
            </p>

        </div>

    </section>

    <section id="authFormPanel">
        <div id="authFormContent">
            <h1 id="authHeading">
                Welcome back
            </h1>

            <p id="authIntro">
                Login to your RuckuZ account.
            </p>

            <div class="tabs">

                <button
                    class="tab active"
                    id="loginTab"
                    type="button">

                    <img
                        class="authButtonArt authLightArt"
                        src="assets/buttons/light/buttonlight.png"
                        alt="">

                    <img
                        class="authButtonArt authDarkArt"
                        src="assets/buttons/dark/buttondark.png"
                        alt="">

                    <span class="authButtonText">
                        Login
                    </span>

                </button>

                <button
                    class="tab"
                    id="registerTab"
                    type="button">

                    <img
                        class="authButtonArt authLightArt"
                        src="assets/buttons/light/buttonlight.png"
                        alt="">

                    <img
                        class="authButtonArt authDarkArt"
                        src="assets/buttons/dark/buttondark.png"
                        alt="">

                    <span class="authButtonText">
                        Register
                    </span>
                </button>
            </div>

            <div
                id="usernameShell"
                class="authInputShell"
                style="display:none;">

                <img
                    class="authInputArt authLightArt"
                    src="assets/buttons/light/inputlight.png"
                    alt="">

                <img
                    class="authInputArt authDarkArt"
                    src="assets/buttons/dark/inputdark.png"
                    alt="">

                <input
                    id="username"
                    placeholder="Username">

            </div>

            <div class="authInputShell">

                <img
                    class="authInputArt authLightArt"
                    src="assets/buttons/light/inputlight.png"
                    alt="">

                <img
                    class="authInputArt authDarkArt"
                    src="assets/buttons/dark/inputdark.png"
                    alt="">

                <input
                    id="email"
                    type="email"
                    placeholder="Email">

            </div>

            <div class="authInputShell">

                <img
                    class="authInputArt authLightArt"
                    src="assets/buttons/light/inputlight.png"
                    alt="">

                <img
                    class="authInputArt authDarkArt"
                    src="assets/buttons/dark/inputdark.png"
                    alt="">

                <input
                    id="password"
                    type="password"
                    placeholder="Password">

            </div>

            <button
                id="forgotPassword"
                type="button">
                Forgot password?
            </button>

            <button
                id="authButton"
                type="button">

                <img
                    class="authButtonArt authLightArt"
                    src="assets/buttons/light/buttonlight.png"
                    alt="">

                <img
                    class="authButtonArt authDarkArt"
                    src="assets/buttons/dark/buttondark.png"
                    alt="">

                <span
                    id="authButtonLabel"
                    class="authButtonText">
                    Login
                </span>

            </button>
            <p id="switchText">
                Don't have an account?
                <span id="switchMode">
                    Register
                </span>
            </p>

            <p id="status"></p>

        </div>
    </section>
</main>

</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
