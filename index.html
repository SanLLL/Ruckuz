<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>RuckuZ</title>

<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/animations.css">

</head>

<body>

<div id="app">

<div class="authCard">

<h1>RuckuZ</h1>

<p class="subtitle">
A place to hang out.
</p>

<div class="tabs">

<button class="tab active" id="loginTab">
Login
</button>

<button class="tab" id="registerTab">
Register
</button>

</div>

<input
id="username"
placeholder="Username"
style="display:none;"
>

<input
id="email"
type="email"
placeholder="Email"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button id="authButton">

Login

</button>

<p id="switchText">

Don't have an account?

<span id="switchMode">

Register

</span>
</p>
<p id="status"></p>
</div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
